[workspace]
resolver = "2"
members = ["crates/mdbin", "crates/synth", "crates/gateway", "crates/bench", "crates/broker"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
mdbin = { path = "crates/mdbin" }
synth = { path = "crates/synth" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
sha3 = "=0.10.8"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "arithmetic", "std"] }
rand = "=0.8.5"
rand_chacha = "=0.3.1"
rand_distr = "=0.4.3"
proptest = "=1.9.0"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "=0.3.31", default-features = false, features = ["sink", "std"] }
zeromq = { version = "=0.7.0", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
bytes = "=1.11.0"
criterion = { version = "=0.7.0", default-features = false, features = ["cargo_bench_support"] }
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
zstd = { version = "=0.13.3", default-features = false, features = ["zdict_builder"] }
redis = { version = "=0.32.7", default-features = false, features = ["tokio-comp", "aio"] }
libc = "=0.2.177"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
